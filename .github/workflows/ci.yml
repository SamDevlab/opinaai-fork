name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: opina_ai
          POSTGRES_USER: opina
          POSTGRES_PASSWORD: opina
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U opina -d opina_ai"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://opina:opina@localhost:5432/opina_ai
      - run: npm run build
